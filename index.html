<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>号卡筛选助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{background:#f2f4f8;color:#1f2329;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:24px}
.header{background:linear-gradient(135deg,#0f52d9,#3d8bfd);color:#fff;padding:18px 16px 16px}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:19px;font-weight:700;letter-spacing:.5px}
.status{font-size:11px;background:rgba(255,255,255,.18);padding:4px 9px;border-radius:20px;white-space:nowrap}
.header-sub{font-size:12px;opacity:.88;margin-top:6px}
.toolbar{background:#fff;padding:12px 16px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(15,40,90,.07)}
.search-box{position:relative;margin-bottom:10px}
.search-box input{width:100%;padding:11px 14px 11px 36px;border:1px solid #e3e6eb;background:#f7f8fa;border-radius:10px;font-size:14px;outline:none;transition:.2s}
.search-box input:focus{border-color:#3d8bfd;background:#fff;box-shadow:0 0 0 3px rgba(61,139,253,.12)}
.search-box .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}
.filter-row{display:flex;gap:8px;align-items:center}
.select-wrap{flex:1;min-width:0;position:relative}
.select-wrap select{width:100%;min-width:0;appearance:none;padding:9px 26px 9px 11px;border:1px solid #e3e6eb;border-radius:9px;background:#fff;font-size:13.5px;color:#1f2329;outline:none;text-overflow:ellipsis}
.select-wrap::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:#8a9099;pointer-events:none}
.loc-btn{flex:0 0 auto;max-width:38%;padding:8px 10px;border:none;border-radius:9px;background:#0f52d9;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.loc-btn.on{background:#e8f0ff;color:#0f52d9}
.filter-row2{display:flex;gap:8px;align-items:center;margin-top:8px}
.price-box{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#f7f8fa;border:1px solid #e3e6eb;border-radius:9px;padding:8px 11px;font-size:12.5px;color:#5a6373}
.price-box input[type=range]{flex:1;min-width:0;width:100%;accent-color:#0f52d9;height:18px}
.price-box b{color:#0f52d9;font-size:13px;min-width:44px;text-align:right}
.op-box{flex:0 0 auto;width:112px;max-width:34%}
.summary{padding:10px 16px 2px;font-size:12px;color:#6b7280;line-height:1.6}
.summary b{color:#0f52d9}
.list{padding:10px 12px 0;display:grid;gap:11px}
.card{width:100%;max-width:100%;background:#fff;border-radius:14px;padding:14px 15px 12px;box-shadow:0 2px 10px rgba(20,40,80,.06);position:relative;overflow:hidden}
.card.local::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#ff5a5f,#ff8a3d)}
.name-row{display:flex;align-items:center;gap:7px;margin-bottom:14px}
.card-name{font-size:19px;font-weight:700;color:#14181f;letter-spacing:.3px;line-height:1.3}
.badge{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:5px;white-space:nowrap}
.badge.local{background:#fff0ec;color:#e8453c}
.badge.nation{background:#eaf6ec;color:#1a9c4a}
.badge.partial{background:#f0f0f5;color:#6b7280}
.badge.op{background:#eef4ff;color:#0f52d9}
/* 第二排：三列大字 */
.highlight{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:6px;text-align:center;padding:10px 4px 12px;background:#f8fafd;border-radius:11px;margin-bottom:12px}
.hl .num{font-size:25px;font-weight:800;line-height:1.15;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hl .num.price{color:#e8453c}
.hl .num.flow{color:#0f52d9}
.hl .num.call{color:#12a150}
.hl .num small{font-size:12px;font-weight:700;margin-left:1px}
.hl .label{font-size:11.5px;color:#8a9099;margin-top:5px;font-weight:500}
/* 第三排：可发地/年龄/首充 加粗加大 */
.info-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:12px}
.info-chip{display:flex;flex-direction:column;justify-content:center;gap:3px;background:#f5f7fb;border:1px solid #e9edf3;border-radius:9px;padding:7px 9px;min-width:0}
.info-chip .k{font-size:10.5px;color:#8a9099;font-weight:500;white-space:nowrap}
.info-chip .v{font-size:16px;font-weight:800;color:#1f2329;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-chip.local-chip{background:#fff7f3;border-color:#ffd9c9}
.info-chip.local-chip .v{color:#d63a30}
.note{font-size:11.5px;color:#8a9099;line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px dashed #eceff4}
.act{flex:1;min-width:0;font-size:11.5px;color:#8a9099;line-height:1.4}
.act b{color:#5a6373;font-weight:600}
.go{flex:0 0 auto;padding:9px 20px;border-radius:22px;background:linear-gradient(135deg,#0f52d9,#3d8bfd);color:#fff;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap;box-shadow:0 4px 10px rgba(15,82,217,.22)}
.empty{text-align:center;padding:64px 24px;color:#8a9099;font-size:13.5px;line-height:1.9}
.empty .big{font-size:40px;display:block;margin-bottom:10px;opacity:.35}
.loading{text-align:center;padding:56px;color:#8a9099;font-size:13.5px}
.spinner{width:26px;height:26px;border:3px solid #e3e6eb;border-top-color:#0f52d9;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;font-size:11px;color:#a8afb8;padding:22px 16px 6px;line-height:1.8}
</style>
</head>

<div class="header">
  <div class="header-row">
    <h1>号卡筛选助手</h1>
    <span class="status" id="dataStatus">加载中…</span>
  </div>
  <div class="header-sub">本省专属优先 · 全国紧随其后 · 外省自动隐藏</div>
</div>

<div class="toolbar">
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索卡名 / 运营商 / 流量 / 标签">
  </div>
  <div class="filter-row">
    <div class="select-wrap">
      <select id="provinceSelect"></select>
    </div>
    <button class="loc-btn" id="locBtn" onclick="locate()">定位本省</button>
  </div>
  <div class="filter-row2">
    <div class="price-box">
      <span>月租 ≤</span>
      <input type="range" id="priceRange" min="19" max="99" value="99" step="1">
      <b id="priceLabel">不限</b>
    </div>
    <div class="select-wrap op-box">
      <select id="operatorSelect">
        <option value="">全部运营商</option>
        <option value="移动">中国移动</option>
        <option value="联通">中国联通</option>
        <option value="电信">中国电信</option>
        <option value="广电">中国广电</option>
      </select>
    </div>
  </div>
</div>

<div class="summary" id="summary"></div>
<div class="list" id="list"><div class="loading"><div class="spinner"></div>正在获取最新卡品数据…</div></div>
<div class="footer">数据来自号卡宇宙店铺，每次打开页面自动拉取最新版本<br>最终套餐以渠道页面与运营商审核为准</div>

const DATA_URL = "cards.json";
let CARD_DATA = [];
let userProvince = localStorage.getItem("hk_province") || "";
let dataFromNet = false;
/* 支持分享链接带省份，如 index.html?p=广东 */
const urlProv = new URLSearchParams(location.search).get("p");
if(urlProv && PROVINCES.includes(urlProv)) userProvince = urlProv;

/* ---------- 数据加载 ---------- */
async function loadData(){
  try{
    const res = await fetch(DATA_URL + "?t=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    if(!Array.isArray(d) || !d.length) throw new Error("空数据");
    CARD_DATA = d; dataFromNet = true;
    setStatus("已同步最新 · " + d.length + "款");
  }catch(e){
    CARD_DATA = DEFAULT_DATA; dataFromNet = false;
    setStatus("离线快照 · " + DEFAULT_DATA.length + "款");
  }
  initProvinceSelect();
  render();
}
function setStatus(t){ document.getElementById("dataStatus").textContent = t; }

/* ---------- 省份选择 ---------- */
function initProvinceSelect(){
  const sel = document.getElementById("provinceSelect");
  sel.innerHTML = '<option value="">全国 / 全部省份</option>' +
    PROVINCES.map(p => `<option value="${p}">${p}</option>`).join("");
  if(userProvince && PROVINCES.includes(userProvince)){
    sel.value = userProvince;
    document.getElementById("locBtn").classList.add("on");
  }
  sel.addEventListener("change", ()=>{
    userProvince = sel.value;
    localStorage.setItem("hk_province", userProvince);
    document.getElementById("locBtn").classList.remove("on");
    render();
  });
}

/* ---------- 定位 ---------- */
const EN2CN = {beijing:"北京",tianjin:"天津",hebei:"河北",shanxi:"山西",inner:"内蒙古",liaoning:"辽宁",jilin:"吉林",heilongjiang:"黑龙江",shanghai:"上海",jiangsu:"江苏",zhejiang:"浙江",anhui:"安徽",fujian:"福建",jiangxi:"江西",shandong:"山东",henan:"河南",hubei:"湖北",hunan:"湖南",guangdong:"广东",guangxi:"广西",hainan:"海南",chongqing:"重庆",sichuan:"四川",guizhou:"贵州",yunnan:"云南",xizang:"西藏",tibet:"西藏",shaanxi:"陕西",gansu:"甘肃",qinghai:"青海",ningxia:"宁夏",xinjiang:"新疆"};

async function locate(){
  const btn = document.getElementById("locBtn");
  btn.textContent = "定位中…";

  // 方式1：IP 定位（无需权限，最快）
  try{
    const r = await fetch("https://ipwho.is/", {cache:"no-store"});
    const j = await r.json();
    if(j && j.success !== false && j.country_code === "CN" && j.region){
      const p = matchProvince(j.region + " " + (j.city||""));
      if(p) return applyLocated(p, "IP定位");
    }
  }catch(e){}

  // 方式2：浏览器定位 + 逆地理编码
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async pos=>{
      try{
        const {latitude:lat, longitude:lon} = pos.coords;
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-CN&zoom=10`, {headers:{"Accept":"application/json"}});
        const j = await r.json();
        const p = matchProvince(JSON.stringify(j.address || {}) + " " + (j.display_name||""));
        if(p) return applyLocated(p, "GPS定位");
      }catch(e){}
      failLocate();
    }, ()=>failLocate(), {timeout:12000, maximumAge:600000});
  }else{
    failLocate();
  }
}

function matchProvince(text){
  const cn = PROVINCES.find(p => text.includes(p));
  if(cn) return cn;
  const low = text.toLowerCase();
  for(const k in EN2CN){ if(low.includes(k)) return EN2CN[k]; }
  return "";
}

function applyLocated(p, way){
  const sel = document.getElementById("provinceSelect");
  sel.value = p;
  userProvince = p;
  localStorage.setItem("hk_province", p);
  const btn = document.getElementById("locBtn");
  btn.textContent = "本省：" + p;
  btn.classList.add("on");
  render();
  if(way) setStatus(way + " · 本省优先");
}

function failLocate(){
  const btn = document.getElementById("locBtn");
  btn.textContent = "定位本省";
  btn.classList.remove("on");
  alert("定位失败，请直接在下拉框选择你所在省份");
}

/* ---------- 渲染 ---------- */
function updatePriceLabel(){
  const v = parseInt(document.getElementById("priceRange").value);
  document.getElementById("priceLabel").textContent = v >= 99 ? "不限" : v + "元";
  render();
}

function provWeight(card, prov){
  if(!prov) return 1;
  if(card.province.includes(prov)) return 0;
  if(card.province.includes("全网")) return 1;
  return 2;
}

function flowText(c){
  const total = (c.general||0) + (c.direct||0);
  return total ? total + "<small>G</small>" : "—";
}

function render(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const prov = document.getElementById("provinceSelect").value;
  const op = document.getElementById("operatorSelect").value;
  const maxPrice = parseInt(document.getElementById("priceRange").value);
  const list = document.getElementById("list");

  let rows = CARD_DATA.filter(c=>{
    if(prov && !(c.province.includes(prov) || c.province.includes("全网"))) return false; // 外省卡不显示
    if(maxPrice < 99 && c.price > maxPrice) return false;
    if(op && c.operator !== op) return false;
    if(q){
      const hay = [c.name, c.rawName||"", c.operator, c.channel, c.note, c.firstRecharge].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  rows.sort((a,b)=>{
    const wa = provWeight(a, prov), wb = provWeight(b, prov);
    if(wa !== wb) return wa - wb;
    if((a.commissionLevel||3) !== (b.commissionLevel||3)) return (a.commissionLevel||3) - (b.commissionLevel||3);
    if(a.price !== b.price) return a.price - b.price;
    return ((b.general+b.direct)||0) - ((a.general+a.direct)||0);
  });

  // 顶部统计
  const sm = document.getElementById("summary");
  if(prov){
    const local = rows.filter(c=>c.province.includes(prov)).length;
    const nat = rows.filter(c=>!c.province.includes(prov) && c.province.includes("全网")).length;
    sm.innerHTML = `📍 <b>${prov}</b>：本省专属 <b>${local}</b> 款 · 全国可发 <b>${nat}</b> 款 · 外省卡已隐藏`;
  }else{
    sm.innerHTML = `共 <b>${rows.length}</b> 款在售卡品，选择省份后自动把本省卡置顶`;
  }

  if(!rows.length){
    list.innerHTML = `<div class="empty"><span class="big">🔍</span>没有符合条件的卡品<br>换个省份或放宽筛选条件试试</div>`;
    return;
  }

  list.innerHTML = rows.map(c=>{
    const isLocal = prov && c.province.includes(prov);
    const isNat = c.province.includes("全网");
    const badge = isLocal ? (c.province.length <= 3 ? `<span class="badge local">${prov}专属</span>` : `<span class="badge local">含${prov}</span>`)
                : isNat ? `<span class="badge nation">全国可发</span>`
                : `<span class="badge partial">限${c.province.length}省</span>`;
    const ship = isNat ? "全国" : c.province.length <= 2 ? c.province.join("、") : `${c.province.length}省`;
    const total = (c.general||0)+(c.direct||0);
    return `
    <div class="card${isLocal?' local':''}">
      <div class="name-row">
        <div class="card-name">${c.name}</div>
        ${badge}
        <span class="badge op">${c.operator}</span>
      </div>
      <div class="highlight">
        <div class="hl"><div class="num price">${c.price}<small>元</small></div><div class="label">月租</div></div>
        <div class="hl"><div class="num flow">${flowText(c)}</div><div class="label">总流量</div></div>
        <div class="hl"><div class="num call">${c.call ? c.call+"<small>分</small>" : "—"}</div><div class="label">通话</div></div>
      </div>
      <div class="info-row">
        <div class="info-chip${isLocal?' local-chip':''}"><span class="k">可发</span><span class="v">${ship}</span></div>
        <div class="info-chip"><span class="k">年龄</span><span class="v">${c.ageMin}-${c.ageMax}岁</span></div>
        <div class="info-chip"><span class="k">首充</span><span class="v">${c.firstRecharge}</span></div>
      </div>
      ${c.note ? `<div class="note">${c.note}</div>` : ""}
      <div class="foot">
        <div class="act">激活方式：<b>${c.activate}</b><br>渠道：${c.channel}</div>
        <a class="go" href="${c.link||'#'}" target="_blank" rel="noopener">去办理</a>
      </div>
    </div>`;
  }).join("");
}

/* ---------- 事件 ---------- */
document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("operatorSelect").addEventListener("change", render);
document.getElementById("priceRange").addEventListener("input", updatePriceLabel);

loadData();
</script>
</body>
</html>
