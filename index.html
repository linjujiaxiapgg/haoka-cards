<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>友佳卡精选助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0e1014;--panel:#181b22;--panel2:#22262f;--line:rgba(255,255,255,.06);
--text:#e9ecf1;--sub:#8b94a7;--primary:#7b61ff;--primary2:#a58bff;
--ok:#26c281;--danger:#ff6b6b;--price:#ff5f6d;--flow:#4dabf7;--call:#51cf66;
}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:28px}
.wrap{max-width:560px;margin:0 auto}
/* 头部 */
.top{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;gap:10px;align-items:center;min-width:0;flex:1}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#b197fc,#6c4dff);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;box-shadow:0 6px 18px rgba(123,97,255,.35)}
.brand h1{font-size:19px;font-weight:800;letter-spacing:.3px;line-height:1.25;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap}
:root{}
.wxChip{flex:0 0 auto;padding:7px 11px;border-radius:20px;background:rgba(26,173,25,.14);border:1px solid rgba(26,173,25,.35);color:#4ade80;font-size:11.5px;font-weight:600;line-height:1.35;text-align:center;white-space:nowrap;cursor:pointer}
.wxChip b{font-size:13px;font-weight:800;color:#63e56a;letter-spacing:.3px}
.wxChip:active{transform:scale(.97)}
/* tabs */
.tabs{margin:6px 16px 14px;background:var(--panel);border-radius:14px;padding:5px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{padding:11px 0;text-align:center;font-size:15px;font-weight:600;color:var(--sub);border-radius:10px;cursor:pointer;transition:.18s}
.tab.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 6px 18px rgba(123,97,255,.35)}
/* 筛选面板 */
.panel{margin:0 16px 12px;background:var(--panel);border-radius:18px;padding:14px 14px 16px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.row:last-child{margin-bottom:0}
.k{width:44px;flex:0 0 44px;font-size:13px;color:var(--sub)}
.main{flex:1;min-width:0}
select,.inp{width:100%;min-width:0;padding:12px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:15px;outline:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#8b94a7 50%),linear-gradient(135deg,#8b94a7 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.locBtn{padding:12px 12px;border-radius:12px;background:rgba(38,194,129,.12);border:1px solid rgba(38,194,129,.3);color:var(--ok);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.locBtn.off{background:var(--panel2);border-color:var(--line);color:var(--sub)}
.ageRow{display:flex;gap:8px}
.ageNo{padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:13px;font-weight:700;cursor:pointer;flex:0 0 auto}
/* 四大运营商 */
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.op{padding:16px 0;text-align:center;border-radius:14px;background:var(--panel2);border:1px solid var(--line);color:var(--sub);font-size:18px;font-weight:800;cursor:pointer;transition:.18s;letter-spacing:.5px}
.op.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(123,97,255,.4)}
/* 渠道 */
.chans{display:flex;flex-wrap:wrap;gap:8px}
.chan{padding:10px 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--sub);font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.chan.on{background:rgba(123,97,255,.16);border-color:rgba(123,97,255,.5);color:var(--primary2)}
.chan b{font-size:11px;opacity:.8;margin-left:3px}
/* 月租 */
.pw{display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;min-width:0;height:22px;background:transparent;-webkit-appearance:none;accent-color:var(--primary)}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--panel2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--primary);border:3px solid #fff;margin-top:-9px;box-shadow:0 2px 8px rgba(123,97,255,.6)}
.pv{width:58px;text-align:right;font-size:13.5px;color:var(--sub);flex:0 0 58px}
/* 结果 */
.tip{padding:4px 18px 8px;font-size:12px;color:var(--sub)}
.list{padding:0 16px;display:grid;gap:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 15px 13px;position:relative;overflow:hidden}
.card.mine::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#ff5f6d,#ff9f43)}
.nameRow{display:flex;align-items:center;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.name{font-size:19px;font-weight:800;line-height:1.3}
.bd{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.bd.mine{background:rgba(255,95,109,.15);color:#ff8a92}
.bd.nat{background:rgba(38,194,129,.14);color:var(--ok)}
.bd.part{background:var(--panel2);color:var(--sub)}
.bd.op{background:rgba(77,171,247,.14);color:var(--flow)}
/* 第二排大字 */
.hl{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:6px;text-align:center;background:#141820;border-radius:12px;padding:11px 4px 12px;margin-bottom:12px}
.hl .n{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hl .n.p{color:var(--price)}.hl .n.f{color:var(--flow)}.hl .n.c{color:var(--call)}
.hl .n small{font-size:12px;font-weight:700;margin-left:1px}
.hl .l{font-size:11.5px;color:var(--sub);margin-top:5px}
/* 第三排 */
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:11px}
.chip{background:#141820;border:1px solid var(--line);border-radius:10px;padding:8px 9px;min-width:0}
.chip.mine{background:rgba(255,95,109,.09);border-color:rgba(255,95,109,.25)}
.chip .ck{font-size:10.5px;color:var(--sub);white-space:nowrap}
.chip .cv{font-size:16px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.mine .cv{color:#ff8a92}
.note{font-size:11.5px;color:var(--sub);line-height:1.55;margin-bottom:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:11px;border-top:1px solid var(--line)}
.act{flex:1;min-width:0;font-size:11.5px;color:var(--sub);line-height:1.5}
.act b{color:#7f8ca0;font-weight:600}
.btnRow{display:flex;gap:8px;flex:0 0 auto}
.btnShare,.btnApply{padding:10px 16px;border:none;border-radius:22px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.btnShare{background:var(--panel2);color:#b9c1d1;border:1px solid var(--line)}
.btnApply{background:linear-gradient(135deg,#2d6bff,#3f8dff);color:#fff;box-shadow:0 5px 14px rgba(45,107,255,.28);padding:10px 20px}
.btnShare:active,.btnApply:active{transform:scale(.97)}
.card.focus{box-shadow:0 0 0 2px rgba(123,97,255,.55),0 10px 30px rgba(123,97,255,.18);border-color:rgba(123,97,255,.5)}
.empty{text-align:center;padding:60px 24px;color:var(--sub);font-size:13.5px;line-height:1.9}
.empty .big{font-size:38px;display:block;margin-bottom:10px;opacity:.4}
.loading{text-align:center;padding:50px;color:var(--sub);font-size:13.5px}
.footNote{text-align:center;font-size:11px;color:#6f7889;padding:20px 18px 4px;line-height:1.9}
/* toast */
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(20px);background:rgba(24,27,34,.96);border:1px solid var(--line);color:#e9ecf1;padding:12px 18px;border-radius:12px;font-size:13.5px;line-height:1.5;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

</div>

/* ---------- 初始化 ---------- */
function initSelect(){
  const sel = document.getElementById("prov");
  sel.innerHTML = '<option value="">全部省份（不筛）</option>' +
    PROVINCES.map(p => `<option value="${p}">${p}</option>`).join("");
}

function initChannels(){
  const cnt = {};
  DATA.forEach(c => cnt[c.channel] = (cnt[c.channel]||0)+1);
  const order = ["卡世界","172","宸宇","号卡宇宙","浩卡联盟"];
  const box = document.getElementById("chans");
  box.innerHTML = order.filter(c => cnt[c]).map(c =>
    `<div class="chan" data-c="${c}">${c}<b>${cnt[c]}</b></div>`).join("");
  box.querySelectorAll(".chan").forEach(el=>{
    el.addEventListener("click", ()=>{
      const c = el.dataset.c;
      if(chans.includes(c)) { chans = chans.filter(x=>x!==c); el.classList.remove("on"); }
      else { chans.push(c); el.classList.add("on"); }
      render();
    });
  });
}

/* ---------- 定位 ---------- */
function setLoc(p){
  prov = p;
  document.getElementById("prov").value = p;
  const b = document.getElementById("locBtn");
  b.textContent = "本省·" + p;
  b.classList.remove("off");
  render();
}

function locate(){
  const btn = document.getElementById("locBtn");
  btn.textContent = "定位中";
  const done = p => { if(p){ setLoc(p); } else { btn.textContent = "定位"; btn.classList.add("off"); toast("定位失败，请在省份下拉里手动选择"); } };

  if(!navigator.geolocation && !window.fetch){ return done(""); }
  // 优先 IP 定位（无需授权，最快）
  fetch("https://ipwho.is/", {cache:"no-store"}).then(r=>r.json()).then(j=>{
    if(j && j.country_code === "CN" && j.region){ done(matchProv(j.region + (j.city||""))); }
    else geoLocate(done);
  }).catch(()=> geoLocate(done));
}

function geoLocate(done){
  if(!navigator.geolocation) return done("");
  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&accept-language=zh-CN`)
      .then(r=>r.json())
      .then(j=>done(matchProv((j.address && JSON.stringify(j.address) || "") + (j.display_name||""))))
      .catch(()=>done(""));
  }, ()=>done(""), {timeout:12000, maximumAge:600000});
}

function matchProv(t){
  const hit = PROVINCES.find(p=>t.includes(p));
  return hit || "";
}

function clearAge(){ document.getElementById("age").value = ""; render(); }

/* ---------- 筛选 ---------- */
function inProv(c){
  if(!prov) return true;
  return c.province.includes("全网") || c.province.includes(prov);
}

function render(){
  const age = parseInt(document.getElementById("age").value) || 0;
  const maxPrice = parseInt(document.getElementById("price").value);
  const q = document.getElementById("q").value.trim().toLowerCase();

  let rows = DATA.filter(c=>{
    if(tab === "flow" && c.type !== "流量卡") return false;
    if(tab === "broadband" && c.type !== "宽带") return false;
    if(!inProv(c)) return false;
    if(age && (age < c.ageMin || age > c.ageMax)) return false;
    if(ops.length && !ops.includes(c.operator)) return false;
    if(chans.length && !chans.includes(c.channel)) return false;
    if(maxPrice < 100 && c.price > maxPrice) return false;
    if(q){
      const s = (c.name + c.operator + c.channel + c.note + c.province.join("")).toLowerCase();
      if(!s.includes(q)) return false;
    }
    return true;
  });

  rows.sort((a,b)=>{
    const wa = prov && a.province.includes(prov) ? 0 : (a.province.includes("全网") ? 1 : 2);
    const wb = prov && b.province.includes(prov) ? 0 : (b.province.includes("全网") ? 1 : 2);
    if(wa !== wb) return wa - wb;
    if(a.commissionLevel !== b.commissionLevel) return a.commissionLevel - b.commissionLevel;
    if(a.price !== b.price) return a.price - b.price;
    return (b.general + b.direct) - (a.general + a.direct);
  });

  const tip = document.getElementById("tip");
  if(prov){
    const mine = rows.filter(c=>c.province.includes(prov)).length;
    const nat = rows.filter(c=>!c.province.includes(prov) && c.province.includes("全网")).length;
    tip.textContent = `${prov}：本省专属 ${mine} 款 · 全国可发 ${nat} 款 · 外省卡已隐藏`;
  }else{
    tip.textContent = `共 ${rows.length} 款在售，选择省份后本省卡自动置顶`;
  }

  const list = document.getElementById("list");
  if(!rows.length){
    list.innerHTML = '<div class="empty"><span class="big">🔍</span>没有符合条件的卡品<br>换个省份或放宽筛选条件试试</div>';
    return;
  }

  list.innerHTML = rows.map(c=>{
    const cid = c.id;
    const mine = prov && c.province.includes(prov);
    const nat = c.province.includes("全网");
    const bd = mine
      ? `<span class="bd mine">${prov}${c.province.length<=3?'专属':'可发'}</span>`
      : nat ? `<span class="bd nat">全国可发</span>`
      : `<span class="bd part">限${c.province.length}省</span>`;
    const ship = nat ? "全国"
      : (mine ? (c.province.length<=2 ? c.province.join("、") : prov+"等"+c.province.length+"省")
              : (c.province.length<=2 ? c.province.join("、") : c.province.length+"省"));
    const total = (c.general||0)+(c.direct||0);
    const flow = total ? total + "<small>G</small>" : "—";
    const call = c.call ? c.call + "<small>分</small>" : "—";
    return `
    <div class="card${mine?' mine':''}" id="c-${cid}">
      <div class="nameRow">
        <div class="name">${c.name}</div>
        ${bd}
        <span class="bd op">${c.operator}</span>
      </div>
      <div class="hl">
        <div><div class="n p">${c.price}<small>元</small></div><div class="l">月租</div></div>
        <div><div class="n f">${flow}</div><div class="l">总流量</div></div>
        <div><div class="n c">${call}</div><div class="l">通话</div></div>
      </div>
      <div class="info">
        <div class="chip${mine?' mine':''}"><div class="ck">可发</div><div class="cv">${ship}</div></div>
        <div class="chip"><div class="ck">年龄</div><div class="cv">${c.ageMin}-${c.ageMax}岁</div></div>
        <div class="chip"><div class="ck">首充</div><div class="cv">${c.firstRecharge}</div></div>
      </div>
      ${c.note ? `<div class="note">${c.note}</div>` : ""}
      <div class="foot">
        <div class="act">渠道：<b>${c.channel}</b><br>${c.photo === "是" ? "需传照片" : "免照片"}</div>
        <div class="btnRow">
          <button class="btnShare" onclick="shareCard('${cid}')">分享</button>
          <button class="btnApply" onclick="applyCard('${cid}')">立即办理</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

  const c = findCard(id); if(!c) return;
  const txt = cardText(c) + String.fromCharCode(10) + cardUrl(id);
  copyText(txt).then(()=> toast("卡片信息和链接已复制<br>直接粘贴发送即可"))
                 .catch(()=> toast("复制失败，请手动选择文字复制"));
}

function shareCard(id){
  const c = findCard(id); if(!c) return;
  const url = cardUrl(id);
  const text = cardText(c);
  if(navigator.share){
    navigator.share({title: c.name + "｜" + c.price + "元 " + ((c.general||0)+(c.direct||0)) + "G", text, url}).catch(()=>{});
  }else{
    copyCard(id);
    toast("当前浏览器不支持系统分享<br>已复制卡片信息和链接");
  }
}

function applyCard(id){
  const c = findCard(id); if(!c) return;
  const shop = CHANNEL_SHOP[c.channel];
  if(shop){ window.open(shop, "_blank"); }
  else { toast("该渠道暂无线上办理入口"); }
}

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  return new Promise((res,rej)=>{
    try{
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      ok ? res() : rej();
    }catch(e){ rej(e); }
  });
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.innerHTML = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 2600);
}

/* ---------- 事件 ---------- */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");
    tab = t.dataset.tab;
    render();
  });
});

document.getElementById("ops").addEventListener("click", e=>{
  const el = e.target.closest(".op");
  if(!el) return;
  const op = el.dataset.op;
  if(ops.includes(op)){
    if(ops.length === 1) return;  // 至少保留一个
    ops = ops.filter(x=>x!==op); el.classList.remove("on");
  }else{ ops.push(op); el.classList.add("on"); }
  render();
});

document.getElementById("prov").addEventListener("change", e=>{
  prov = e.target.value;
  const b = document.getElementById("locBtn");
  if(prov){ b.textContent = "本省·"+prov; b.classList.remove("off"); }
  else { b.textContent = "定位"; b.classList.add("off"); }
  render();
});

document.getElementById("age").addEventListener("input", render);
document.getElementById("q").addEventListener("input", render);
document.getElementById("price").addEventListener("input", e=>{
  document.getElementById("pv").textContent = (e.target.value >= 100 ? "≤100元" : "≤" + e.target.value + "元");
  render();
});
